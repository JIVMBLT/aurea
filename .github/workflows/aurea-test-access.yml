name: AUREA - Acceso universal de pruebas

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: aurea-test-pages
  cancel-in-progress: false

jobs:
  provision-and-publish:
    runs-on: ubuntu-latest
    environment: github-pages
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      AUREA_TEST_EMAIL: ${{ vars.AUREA_TEST_EMAIL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      AUREA_TEST_PASSWORD: ${{ secrets.AUREA_TEST_PASSWORD }}
    steps:
      - name: Checkout de la rama request
        uses: actions/checkout@v4
        with:
          ref: request
          persist-credentials: false
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar dependencias de aprovisionamiento
        run: npm install --no-save --no-package-lock --ignore-scripts @supabase/supabase-js@2
      - name: Registrar o actualizar cuenta de pruebas en Supabase
        run: node scripts/provision-test-user.mjs
      - name: Construir archivos publicos sin credenciales
        run: |
          mkdir -p dist
          cp index.html supabase-adapter.js auth-password.js dist/
          node -e "const fs=require('fs'); const email=process.env.AUREA_TEST_EMAIL; if(!email) process.exit(1); fs.writeFileSync('dist/auth-config.js','window.AureaAuthConfig = Object.freeze({ email: '+JSON.stringify(email.trim().toLowerCase())+' });\\n')"
          if grep -Fq "$AUREA_TEST_PASSWORD" dist/auth-config.js; then echo "Error: secreto filtrado en configuracion"; exit 1; fi
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Publicar artefacto estatico
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Desplegar pagina
        id: deployment
        uses: actions/deploy-pages@v4
